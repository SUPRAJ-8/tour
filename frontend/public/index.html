<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon-48.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a9d8f" />
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="Golden Hope Travels - Discover Amazing Travel Destinations & Tour Packages" />
    <meta
      name="description"
      content="Explore the world with Golden Hope Travels. Book exclusive travel packages, guided tours, and unforgettable experiences across multiple countries. Best deals on adventure, cultural, and luxury tours."
    />
    <meta name="keywords" content="travel tours, tour packages, vacation packages, travel destinations, guided tours, adventure tours, cultural tours, luxury travel, international tours, travel booking" />
    <meta name="author" content="Golden Hope Travels" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://goldenhopetravels.com/" />
    <meta property="og:title" content="Golden Hope Travels - Discover Amazing Travel Destinations & Tour Packages" />
    <meta property="og:description" content="Explore the world with Golden Hope Travels. Book exclusive travel packages, guided tours, and unforgettable experiences across multiple countries." />
    <meta property="og:image" content="https://goldenhopetravels.com/images/logo.png" />
    <meta property="og:site_name" content="Golden Hope Travels" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://goldenhopetravels.com/" />
    <meta property="twitter:title" content="Golden Hope Travels - Discover Amazing Travel Destinations & Tour Packages" />
    <meta property="twitter:description" content="Explore the world with Golden Hope Travels. Book exclusive travel packages, guided tours, and unforgettable experiences." />
    <meta property="twitter:image" content="https://goldenhopetravels.com/images/logo.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://goldenhopetravels.com/" />
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Preconnect & Preload Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.onload=null;this.removeAttribute('media');">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>

    <!-- Preload the specific woff2 actually used by the hero title (largest above-the-fold text) -->
    <link rel="preload" as="font" type="font/woff2"
          href="https://fonts.gstatic.com/s/poppins/v24/pxiByp8kv8JHgFVrLCz7Z1xlFQ.woff2" crossorigin>

    <!-- API origin — CRA's InterpolateHtmlPlugin substitutes %REACT_APP_API_URL% at build time -->
    <link rel="preconnect" href="%REACT_APP_API_URL%" crossorigin>
    <link rel="dns-prefetch" href="%REACT_APP_API_URL%">

    <title>Golden Hope Travels</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
